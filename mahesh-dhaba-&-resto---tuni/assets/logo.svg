<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB15B"/>
      <stop offset="100%" stop-color="#C89D42"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D261C"/>
      <stop offset="100%" stop-color="#141211"/>
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#C89D42" stroke-width="2"/>
  
  <!-- Subtle Ornamental Ring -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="#C89D42" stroke-width="0.8" stroke-dasharray="2,2"/>
  
  <!-- Stylized Indian Handi Pot / Flame Symbol -->
  <path d="M30 42 C30 38 70 38 70 42 C70 44 67 46 67 46 C67 58 60 68 50 68 C40 68 33 58 33 46 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="50" cy="42" rx="20" ry="4" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <path d="M42 36 Q50 30 50 25 Q50 30 58 36" fill="none" stroke="#B94D25" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="22" r="2.5" fill="#B94D25"/>
  
  <!-- M Monogram -->
  <text x="50" y="58" font-family="'DM Serif Display', Georgia, serif" font-size="16" fill="url(#goldGrad)" text-anchor="middle" font-weight="bold">M</text>
  
  <!-- Bottom Star Accent -->
  <polygon points="50,75 52,80 57,80 53,83 55,88 50,85 45,88 47,83 43,80 48,80" fill="url(#goldGrad)"/>
</svg>
